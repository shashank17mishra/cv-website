<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language composition: HTML 40.1%, CSS 39.5%, JavaScript 20.4%">
  <style>
    .bg { fill: #f6f7fb }
    .bar-html { fill: #e44d26 }
    .bar-css { fill: #264de4 }
    .bar-js { fill: #f0db4f }
    .legend-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-size: 12px; fill: #222 }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-size: 18px; fill: #111 }
  </style>

  <rect width="600" height="200" class="bg" rx="12"/>
  <text x="24" y="36" class="title">Language composition</text>

  <!-- stacked bar -->
  <g transform="translate(24,60)">
    <!-- total width 552 -->
    <rect x="0" y="0" width="221" height="28" rx="6" class="bar-html"/>
    <rect x="221" y="0" width="218" height="28" rx="6" class="bar-css"/>
    <rect x="439" y="0" width="113" height="28" rx="6" class="bar-js"/>
    <rect x="0" y="36" width="552" height="1" fill="#e6e9f2"/>

    <!-- percent labels on bar -->
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="11">HTML 40.1%</text>
    <text x="330" y="20" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="11">CSS 39.5%</text>
    <text x="495" y="20" text-anchor="middle" fill="#222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="11">JS 20.4%</text>
  </g>

  <!-- legend -->
  <g transform="translate(24,110)">
    <rect x="0" y="0" width="14" height="14" rx="3" class="bar-html"/>
    <text x="22" y="12" class="legend-text">HTML — 40.1%</text>

    <rect x="160" y="0" width="14" height="14" rx="3" class="bar-css"/>
    <text x="182" y="12" class="legend-text">CSS — 39.5%</text>

    <rect x="320" y="0" width="14" height="14" rx="3" class="bar-js"/>
    <text x="342" y="12" class="legend-text">JavaScript — 20.4%</text>
  </g>

  <text x="24" y="170" class="legend-text">Generated: 2026</text>
</svg>
